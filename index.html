<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyOS | By Girish</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* AUTH GATE */
        #auth-gate { 
            position: fixed; inset: 0; background: white; z-index: 2000; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
        }

        /* SIDEBAR / DRAWER */
        #sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--card); border-right: 1px solid #e2e8f0; z-index: 1500;
            transition: 0.3s; padding: 20px;
        }
        #sidebar.open { left: 0; }
        .overlay { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
            display: none; z-index: 1400; 
        }

        /* HEADER */
        header { 
            padding: 15px 20px; background: var(--card); display: flex; 
            align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0;
        }
        .menu-btn { font-size: 1.5rem; cursor: pointer; background: none; border: none; margin-right: 15px; }

        /* UI ELEMENTS */
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .card { background: white; border-radius: 20px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .btn { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; width: 100%; transition: 0.2s; }
        .btn-p { background: var(--p); color: white; margin-bottom: 10px; }
        .btn-guest { background: #f1f5f9; color: var(--text); }
        input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 10px; }
        .pfp-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid var(--p); }

        .section { display: none; }
        .section.active { display: block; }
        .nav-link { display: block; padding: 15px; color: var(--text); text-decoration: none; font-weight: 600; border-radius: 10px; margin-bottom: 5px; cursor: pointer; }
        .nav-link:hover { background: #f1f5f9; }
    </style>
</head>
<body>

<div id="auth-gate">
    <h1 style="font-size: 2.5rem; margin-bottom: 10px;">⚡ StudyOS</h1>
    <p style="color: #64748b; margin-bottom: 30px;">Your ultimate focus companion</p>
    <div style="width: 100%; max-width: 300px;">
        <button class="btn btn-p" id="login-google">Sign in with Google</button>
        <button class="btn btn-guest" onclick="closeAuth()">Continue as Guest</button>
    </div>
    <p style="margin-top: 50px; font-size: 0.8rem; font-weight: bold; color: #94a3b8;">Made By Girish</p>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div id="sidebar">
    <div style="display:flex; align-items:center; margin-bottom:30px;">
        <img id="side-pfp" class="pfp-preview" src="https://via.placeholder.com/80" style="margin:0 15px 0 0; width:50px; height:50px;">
        <div>
            <div id="side-name" style="font-weight:800;">Student</div>
            <div style="font-size:0.7rem; color:gray;">Active Session</div>
        </div>
    </div>
    <div class="nav-link" onclick="openPage('dash')">🏠 Dashboard</div>
    <div class="nav-link" onclick="openPage('flash')">📚 Flashcards</div>
    <div class="nav-link" onclick="openPage('pomodoro')">⏲️ Pomodoro</div>
    <div class="nav-link" onclick="openPage('calc')">🧮 Calculator</div>
    <div class="nav-link" onclick="openPage('settings')">⚙️ Settings</div>
    <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
    <button class="btn btn-guest" onclick="location.reload()">🚪 Logout</button>
</div>

<header>
    <button class="menu-btn" onclick="toggleMenu()">☰</button>
    <div style="font-weight: 800; font-size: 1.2rem;">StudyOS</div>
</header>

<main class="container">
    <div id="dash" class="section active">
        <h2>Weekly Progress</h2>
        <div class="card" style="background: linear-gradient(135deg, #6366f1, #a855f7); color:white;">
            <h3>Welcome back!</h3>
            <p>You've completed 0 tasks today. Keep it up!</p>
        </div>
    </div>

    <div id="pomodoro" class="section">
        <h2>Focus Timer</h2>
        <div class="card" style="text-align:center;">
            <div id="timer" style="font-size:4rem; font-weight:800; margin-bottom:20px;">25:00</div>
            <button class="btn btn-p" onclick="startTimer()">Start Session</button>
        </div>
    </div>

    <div id="settings" class="section">
        <h2>Account Settings</h2>
        <div class="card">
            <h3>Profile</h3>
            <img id="profile-pic" class="pfp-preview" src="https://via.placeholder.com/80">
            <input type="text" id="edit-name" placeholder="Edit Display Name">
            <input type="text" id="edit-pfp" placeholder="Paste Image URL for PFP">
            <button class="btn btn-p" onclick="updateProfile()">Save Changes</button>
        </div>
        <div class="card">
            <h3>System</h3>
            <button class="btn btn-guest" onclick="localStorage.clear(); location.reload();">Reset All Data</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6fVzFz2IdjYsCt8TK_nGPwqbxrQ8hM3s",
        authDomain: "studyos-a8e51.firebaseapp.com",
        projectId: "studyos-a8e51",
        storageBucket: "studyos-a8e51.firebasestorage.app",
        messagingSenderId: "174218643372",
        appId: "1:174218643372:web:9cbd8066f745ba4171dc09"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // AUTH LOGIC
    document.getElementById('login-google').onclick = () => signInWithPopup(auth, provider).then(() => closeAuth());
    
    window.closeAuth = () => { document.getElementById('auth-gate').style.display = 'none'; };

    onAuthStateChanged(auth, (user) => {
        if(user) {
            document.getElementById('side-name').textContent = user.displayName;
            document.getElementById('side-pfp').src = user.photoURL;
            document.getElementById('profile-pic').src = user.photoURL;
            closeAuth();
        }
    });

    // NAVIGATION LOGIC
    window.toggleMenu = () => {
        const side = document.getElementById('sidebar');
        const over = document.getElementById('overlay');
        side.classList.toggle('open');
        over.style.display = side.classList.contains('open') ? 'block' : 'none';
    };

    window.openPage = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        toggleMenu();
    };

    // PROFILE LOGIC
    window.updateProfile = () => {
        const newName = document.getElementById('edit-name').value;
        const newPfp = document.getElementById('edit-pfp').value;
        if(newName) {
            document.getElementById('side-name').textContent = newName;
            alert("Name updated locally!");
        }
        if(newPfp) {
            document.getElementById('side-pfp').src = newPfp;
            document.getElementById('profile-pic').src = newPfp;
        }
    };

    // TIMER LOGIC
    let time = 1500;
    window.startTimer = () => {
        setInterval(() => {
            if(time > 0) {
                time--;
                let m = Math.floor(time/60); let s = time%60;
                document.getElementById('timer').textContent = `${m}:${s<10?'0':''}${s}`;
            }
        }, 1000);
    };
</script>
</body>
</html>
