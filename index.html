<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyOS | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; --accent: #f43f5e; }
        .dark { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.3s; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 50px; }
        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); border-right: 1px solid var(--border); z-index: 1500; padding: 25px; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 1400; backdrop-filter: blur(4px); }
        .container { max-width: 900px; margin: auto; padding: 20px; }
        .main-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
        .grid-stats { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        .streak-big { border: 2px solid #fbbf24; background: linear-gradient(135deg, var(--card), #fffbeb); grid-row: span 1; }
        .scene { width: 100%; height: 250px; perspective: 1000px; cursor: pointer; }
        .card-3d { width: 100%; height: 100%; position: relative; transition: 0.6s; transform-style: preserve-3d; }
        .card-3d.flipped { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 20px; display: flex; align-items: center; justify-content: center; padding: 20px; font-weight: 600; border: 2px solid var(--p); background: var(--card); }
        .back { transform: rotateY(180deg); background: var(--p); color: white; }
        .slide-anim { animation: slide 0.4s ease-in-out; }
        @keyframes slide { 0% { transform: translateX(50px); opacity: 0; } 100% { transform: translateX(0); opacity: 1; } }
        .pomo-circle { width: 180px; height: 180px; border-radius: 50%; border: 8px solid var(--p); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 800; margin: 20px auto; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .btn { padding: 15px; border-radius: 12px; border: none; cursor: pointer; font-weight: 700; background: var(--p); color: white; width: 100%; }
        .btn-sec { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .t-item { display: flex; align-items: center; padding: 12px; background: var(--bg); border-radius: 12px; margin-bottom: 8px; }
        .section { display: none; animation: slide 0.3s; }
        .active { display: block; }
        @media (min-width: 992px) { body { padding-left: 280px; } #sidebar { left: 0; } #menu-btn { display: none; } }
    </style>
</head>
<body class="light">
    <div id="auth-gate" style="position:fixed; inset:0; background:white; z-index:2000; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h1>⚡ StudyOS</h1>
        <button class="btn" id="login-google" style="width:250px">Sign in with Google</button>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div id="sidebar">
        <h2 id="side-name">Scholar</h2>
        <div onclick="openPage('dash')" style="padding:15px 0; cursor:pointer;">🏠 Dashboard</div>
        <div onclick="openPage('flash')" style="padding:15px 0; cursor:pointer;">📚 Flashcards</div>
        <div onclick="openPage('pomo')" style="padding:15px 0; cursor:pointer;">⏱️ Pomodoro</div>
        <div onclick="openPage('calc')" style="padding:15px 0; cursor:pointer;">🔢 Calculator</div>
        <div onclick="openPage('settings')" style="padding:15px 0; cursor:pointer;">⚙️ Settings</div>
        <button class="btn" onclick="toggleDarkMode()" style="margin-top:auto">🌗 Night Mode</button>
        <button class="btn" style="margin-top:10px; background:var(--accent)" id="logout">Logout</button>
    </div>
    <header style="padding:15px; background:var(--card); display:flex; justify-content:space-between; border-bottom:1px solid var(--border); sticky; top:0; z-index:1000;">
        <button onclick="toggleMenu()" id="menu-btn" style="background:none; border:none; font-size:1.5rem;">☰</button>
        <div style="font-weight:800;">StudyOS</div>
        <div id="head-pfp" style="width:35px; height:35px; border-radius:10px; background:var(--p); color:white; display:flex; align-items:center; justify-content:center;">G</div>
    </header>
    <main class="container">
        <div id="dash" class="section active">
            <h2 id="welcome">Hi, User!</h2>
            <div class="grid-stats">
                <div class="stat-box streak-big">🔥 <span id="streak-val" style="font-size:2rem; display:block;">1</span> Streak</div>
                <div class="stat-box">✅ <span id="task-stat">0</span> Tasks</div>
                <div class="stat-box">📖 <span id="fc-stat">0</span> Cards</div>
            </div>
            <div class="main-card">
                <h3>To-Do List</h3>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <input type="text" id="t-in" style="flex:1; padding:12px; border-radius:12px; border:1px solid var(--border);">
                    <button class="btn" onclick="addTask()" style="width:50px">+</button>
                </div>
                <div id="t-list"></div>
            </div>
        </div>
        <div id="flash" class="section">
            <div class="scene" onclick="this.children[0].classList.toggle('flipped')">
                <div class="card-3d" id="fc-card">
                    <div class="face" id="fc-f">No cards</div>
                    <div class="face back" id="fc-b">Add one below</div>
                </div>
            </div>
            <div style="display:flex; justify-content:space-between; margin:20px 0;">
                <button class="btn-sec" onclick="moveFC(-1)" style="padding:10px 20px">◀</button>
                <span id="fc-page">0/0</span>
                <button class="btn-sec" onclick="moveFC(1)" style="padding:10px 20px">▶</button>
            </div>
            <div class="main-card">
                <input type="text" id="fc-q" placeholder="Front" style="width:100%; padding:10px; margin-bottom:10px;">
                <input type="text" id="fc-a" placeholder="Back" style="width:100%; padding:10px; margin-bottom:10px;">
                <button class="btn" onclick="addFC()">Add Card</button>
            </div>
        </div>
        <div id="pomo" class="section">
            <div class="main-card" style="text-align:center;">
                <div class="pomo-circle" id="p-timer">25:00</div>
                <input type="number" id="p-min" placeholder="Mins" style="width:80px; padding:10px; text-align:center;">
                <div style="display:flex; gap:10px; margin-top:20px;">
                    <button class="btn" onclick="startPomo()">Start</button>
                    <button class="btn-sec" onclick="pausePomo()">Pause</button>
                </div>
            </div>
        </div>
        <div id="calc" class="section">
            <div class="main-card">
                <input type="text" id="c-scr" readonly style="width:100%; padding:20px; font-size:1.5rem; text-align:right; margin-bottom:15px;">
                <div class="calc-grid">
                    <button class="btn-sec" onclick="cBtn('C')">C</button><button class="btn-sec" onclick="cBtn('/')">/</button><button class="btn-sec" onclick="cBtn('*')">*</button><button class="btn-sec" onclick="cBtn('-')">-</button>
                    <button class="btn-sec" onclick="cBtn('7')">7</button><button class="btn-sec" onclick="cBtn('8')">8</button><button class="btn-sec" onclick="cBtn('9')">9</button><button class="btn" onclick="cBtn('+')">+</button>
                    <button class="btn-sec" onclick="cBtn('4')">4</button><button class="btn-sec" onclick="cBtn('5')">5</button><button class="btn-sec" onclick="cBtn('6')">6</button><button class="btn" onclick="solve()">=</button>
                </div>
            </div>
        </div>
        <div id="settings" class="section">
            <div class="main-card">
                <h3>Settings</h3>
                <input type="text" id="name-in" placeholder="New Name" style="width:100%; padding:10px; margin-bottom:10px;">
                <button class="btn" onclick="saveSet()">Save</button>
            </div>
        </div>
    </main>
    <script type="module">
        import { firebaseConfig } from './config.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), prov = new GoogleAuthProvider();
        let d = { tasks: [], fc: [], streak: 1, last: null, name: "Girish" }, uid = null, fcI = 0, tmr = null, left = 1500;
        onAuthStateChanged(auth, async (u) => { if(u) { uid = u.uid; const s = await getDoc(doc(db, "u", uid)); if(s.exists()) { d = s.data(); hStrk(); } else { d.last = new Date().toISOString(); } document.getElementById('auth-gate').style.display='none'; syn(); } });
        const hStrk = () => { const t = new Date().toDateString(), l = d.last ? new Date(d.last).toDateString() : null; if(l !== t) { const y = new Date(); y.setDate(y.getDate()-1); d.streak = (l === y.toDateString()) ? d.streak + 1 : 1; d.last = new Date().toISOString(); } };
        const syn = async () => { if(uid) await setDoc(doc(db, "u", uid), d); ren(); };
        window.toggleMenu = () => { const s = document.getElementById('sidebar'); s.classList.toggle('open'); document.getElementById('overlay').style.display = s.classList.contains('open') ? 'block' : 'none'; };
        window.openPage = (p) => { document.querySelectorAll('.section').forEach(s => s.classList.remove('active')); document.getElementById(p).classList.add('active'); if(window.innerWidth < 992) toggleMenu(); };
        window.toggleDarkMode = () => document.body.classList.toggle('dark');
        window.addTask = () => { const v = document.getElementById('t-in').value; if(v) { d.tasks.push({t: v, d: false}); document.getElementById('t-in').value=""; syn(); } };
        window.toggleT = (i) => { d.tasks[i].d = !d.tasks[i].d; syn(); };
        window.addFC = () => { const q = document.getElementById('fc-q').value, a = document.getElementById('fc-a').value; if(q) { d.fc.push({q, a}); syn(); } };
        window.moveFC = (dir) => { if(!d.fc.length) return; document.getElementById('fc-card').classList.add('slide-anim'); setTimeout(() => { fcI = (fcI + dir + d.fc.length) % d.fc.length; ren(); document.getElementById('fc-card').classList.remove('slide-anim'); }, 300); };
        window.startPomo = () => { const m = document.getElementById('p-min').value; if(m) left = m * 60; if(!tmr) tmr = setInterval(() => { if(left > 0) { left--; upP(); } else clearInterval(tmr); }, 1000); };
        window.pausePomo = () => { clearInterval(tmr); tmr = null; };
        const upP = () => { const m = Math.floor(left/60), s = left%60; document.getElementById('p-timer').innerText = `${m}:${s<10?'0':''}${s}`; };
        window.cBtn = (v) => v === 'C' ? document.getElementById('c-scr').value = "" : document.getElementById('c-scr').value += v;
        window.solve = () => { try { document.getElementById('c-scr').value = eval(document.getElementById('c-scr').value); } catch { alert("Error"); } };
        window.saveSet = () => { const n = document.getElementById('name-in').value; if(n) d.name = n; syn(); };
        const ren = () => {
            document.getElementById('welcome').innerText = `Hi, ${d.name}!`;
            document.getElementById('side-name').innerText = d.name;
            document.getElementById('streak-val').innerText = d.streak;
            document.getElementById('task-stat').innerText = d.tasks.filter(t => !t.d).length;
            document.getElementById('fc-stat').innerText = d.fc.length;
            const tl = document.getElementById('t-list'); tl.innerHTML = "";
            d.tasks.forEach((t, i) => { tl.innerHTML += `<div class="t-item" onclick="toggleT(${i})" style="${t.d?'opacity:0.5;text-decoration:line-through':''}">${t.t}</div>`; });
            if(d.fc[fcI]) { document.getElementById('fc-f').innerText = d.fc[fcI].q; document.getElementById('fc-b').innerText = d.fc[fcI].a; document.getElementById('fc-page').innerText = `${fcI+1}/${d.fc.length}`; }
        };
        document.getElementById('login-google').onclick = () => signInWithPopup(auth, prov);
        document.getElementById('logout').onclick = () => signOut(auth).then(() => location.reload());
    </script>
</body>
    </html>
