<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyOS Pro | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --sidebar: #ffffff;
            --card: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --accent: #f43f5e;
            --glass: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            margin: 0; background-color: var(--bg); color: var(--text-main);
            display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar Navigation */
        nav {
            width: 260px; background: var(--sidebar); border-right: 1px solid #e2e8f0;
            display: flex; flex-direction: column; padding: 24px;
        }

        .logo { font-weight: 800; font-size: 1.5rem; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 10px; }
        
        .nav-item {
            padding: 12px 16px; border-radius: 12px; cursor: pointer; color: var(--text-sub);
            font-weight: 600; margin-bottom: 8px; transition: all 0.2s; border: none; background: none;
            text-align: left; width: 100%; font-size: 1rem;
        }
        .nav-item:hover { background: #f1f5f9; color: var(--primary); }
        .nav-item.active { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }

        /* Main Content Area */
        main { flex: 1; padding: 40px; overflow-y: auto; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        
        .user-pill {
            background: var(--glass); backdrop-filter: blur(10px); padding: 8px 16px;
            border-radius: 99px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px;
        }

        /* Modern Cards */
        .glass-card {
            background: var(--card); border-radius: 24px; padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8);
        }

        .streak-card {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white; padding: 20px; border-radius: 20px; margin-bottom: 24px;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* Inputs & Buttons */
        .input-box {
            width: 100%; padding: 14px 20px; border-radius: 14px;
            border: 2px solid #e2e8f0; outline: none; transition: 0.2s; font-size: 1rem;
        }
        .input-box:focus { border-color: var(--primary); }

        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 14px 28px;
            border-radius: 14px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(99, 102, 241, 0.4); }

        /* Task List */
        .task-item {
            display: flex; align-items: center; padding: 16px; background: #f8fafc;
            border-radius: 16px; margin-top: 12px; gap: 12px; transition: 0.2s;
        }
        .task-item:hover { background: #f1f5f9; }
        input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--primary); cursor: pointer; }

        .section { display: none; animation: fadeIn 0.3s ease-in-out; }
        .section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<nav>
    <div class="logo"><span>⚡</span> StudyOS</div>
    <button class="nav-item active" onclick="showSection('dash', this)">Dashboard</button>
    <button class="nav-item" onclick="showSection('flash', this)">Flashcards</button>
    <button class="nav-item" onclick="showSection('settings', this)">Settings</button>
    
    <div style="margin-top: auto;">
        <button id="login-btn" class="btn-primary" style="width: 100%;">Connect Account</button>
    </div>
</nav>

<main>
    <div class="header">
        <div>
            <h1 style="margin:0; font-size: 1.8rem;">Hello, <span id="user-name">Scholar</span>!</h1>
            <p style="color: var(--text-sub); margin: 5px 0 0 0;">Ready to crush your goals today?</p>
        </div>
        <div class="user-pill">
            <div id="status-dot" style="width:10px; height:10px; background:#cbd5e1; border-radius:50%;"></div>
            <span id="auth-text" style="font-size: 0.85rem; font-weight: 600;">Offline</span>
        </div>
    </div>

    <div id="dash" class="section active">
        <div class="streak-card">
            <div>
                <div style="font-size: 0.9rem; opacity: 0.9;">Current Streak</div>
                <div style="font-size: 2rem; font-weight: 800;"><span id="streak-val">0</span> Days</div>
            </div>
            <div style="font-size: 3rem;">🔥</div>
        </div>

        <div class="glass-card">
            <h3 style="margin-top:0;">Focus Tasks</h3>
            <div style="display:flex; gap:12px; margin-bottom:20px;">
                <input type="text" id="task-input" class="input-box" placeholder="What subject are we tackling?">
                <button class="btn-primary" onclick="addTask()">Add</button>
            </div>
            <div id="task-list">
                </div>
        </div>
    </div>

    <div id="flash" class="section">
        <div class="glass-card" style="text-align: center;">
            <h2>Quick Review</h2>
            <div id="fc-card" style="height: 250px; background: #f1f5f9; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; padding: 20px; cursor: pointer; border: 2px dashed #cbd5e1; margin-bottom: 20px;">
                Add some cards to begin!
            </div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="fc-q" class="input-box" placeholder="Front">
                <input type="text" id="fc-a" class="input-box" placeholder="Back">
                <button class="btn-primary" onclick="addFC()">Save</button>
            </div>
        </div>
    </div>
</main>

<script type="module">
    // --- FIREBASE INTEGRATION ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6fVzFz2IdjYsCt8TK_nGPwqbxrQ8hM3s",
        authDomain: "studyos-a8e51.firebaseapp.com",
        projectId: "studyos-a8e51",
        storageBucket: "studyos-a8e51.firebasestorage.app",
        messagingSenderId: "174218643372",
        appId: "1:174218643372:web:9cbd8066f745ba4171dc09"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let data = { tasks: [], streak: 0 };

    // Login logic
    document.getElementById('login-btn').onclick = () => signInWithPopup(auth, provider);

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            currentUser = user;
            document.getElementById('user-name').textContent = user.displayName.split(' ')[0];
            document.getElementById('status-dot').style.background = "#10b981";
            document.getElementById('auth-text').textContent = "Cloud Sync Active";
            document.getElementById('login-btn').style.display = 'none';
            
            const docSnap = await getDoc(doc(db, "users", user.uid));
            if(docSnap.exists()) data = docSnap.data();
            render();
        }
    });

    window.addTask = async () => {
        const input = document.getElementById('task-input');
        if(!input.value) return;
        data.tasks.push({text: input.value, done: false});
        input.value = '';
        render();
        if(currentUser) await setDoc(doc(db, "users", currentUser.uid), data);
    };

    window.toggleTask = async (i) => {
        data.tasks[i].done = !data.tasks[i].done;
        render();
        if(currentUser) await setDoc(doc(db, "users", currentUser.uid), data);
    };

    function render() {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        data.tasks.forEach((t, i) => {
            list.innerHTML += `
                <div class="task-item">
                    <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})">
                    <span style="${t.done?'text-decoration:line-through; color:var(--text-sub)':''}">${t.text}</span>
                </div>`;
        });
        document.getElementById('streak-val').textContent = data.streak;
    }

    window.showSection = (id, el) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        el.classList.add('active');
    };
</script>
</body>
</html>
