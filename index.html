<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyOS | Girish</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #6366f1; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: var(--text); padding-bottom: 30px; }

        /* AUTH GATE */
        #auth-gate { position: fixed; inset: 0; background: white; z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; }
        .auth-btn { width: 100%; max-width: 300px; padding: 14px; border-radius: 14px; border: 1px solid #e2e8f0; background: white; margin-bottom: 12px; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        
        /* SIDEBAR & DRAWER */
        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: white; border-right: 1px solid #e2e8f0; z-index: 1500; transition: 0.3s; padding: 25px; }
        #sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 1400; backdrop-filter: blur(2px); }

        /* 3D FLASHCARD */
        .scene { width: 100%; height: 280px; perspective: 1000px; margin-bottom: 20px; cursor: pointer; }
        .card-3d { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
        .card-3d.is-flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 24px; border: 2px solid var(--p); background: white; padding: 20px; text-align: center; font-size: 1.1rem; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .card-back { transform: rotateY(180deg); background: var(--p); color: white; }
        .card-img { max-width: 100%; max-height: 140px; border-radius: 12px; margin-top: 10px; object-fit: cover; }

        /* UI ELEMENTS */
        header { padding: 15px 20px; background: white; display: flex; align-items: center; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; z-index: 1000; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .card { background: white; border-radius: 24px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border: 1px solid #f1f5f9; }
        .btn-p { background: var(--p); color: white; border: none; padding: 14px; border-radius: 14px; width: 100%; font-weight: 700; cursor: pointer; }
        .pfp-circle { width: 60px; height: 60px; border-radius: 50%; background: var(--p); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.5rem; overflow: hidden; }
        .section { display: none; }
        .section.active { display: block; }

        /* CALCULATOR */
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .calc-btn { padding: 15px; border-radius: 12px; border: none; background: #f1f5f9; font-weight: 800; cursor: pointer; }
        .calc-display { background: #1e293b; color: white; padding: 20px; border-radius: 15px; text-align: right; font-size: 1.5rem; margin-bottom: 10px; min-height: 65px; overflow: hidden; }
    </style>
</head>
<body>

<div id="auth-gate">
    <h1 style="font-size: 2.5rem; margin-bottom: 5px;">⚡ StudyOS</h1>
    <p style="color: #64748b; margin-bottom: 30px;">Your Premium Learning Space</p>
    <button class="auth-btn" id="login-google">Sign in with Google</button>
    <button class="auth-btn" onclick="closeAuth()">Continue as Guest</button>
    <p style="position: absolute; bottom: 30px; font-weight: 800;">Made By Girish</p>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div id="sidebar">
    <div style="display:flex; align-items:center; margin-bottom:30px;">
        <div id="side-pfp-box" class="pfp-circle"></div>
        <div style="margin-left:15px"><div id="side-name" style="font-weight:800;">Scholar</div></div>
    </div>
    <div onclick="openPage('dash')" style="padding:15px 0; cursor:pointer;">🏠 Dashboard</div>
    <div onclick="openPage('pomo')" style="padding:15px 0; cursor:pointer;">⏲️ Pomodoro</div>
    <div onclick="openPage('flash')" style="padding:15px 0; cursor:pointer;">📚 Flashcards</div>
    <div onclick="openPage('calc')" style="padding:15px 0; cursor:pointer;">🧮 Calculator</div>
    <div onclick="openPage('settings')" style="padding:15px 0; cursor:pointer;">⚙️ Settings</div>
    <button class="btn-p" style="margin-top:40px; background:#fee2e2; color:#ef4444;" id="logout-btn">Logout</button>
</div>

<header>
    <button onclick="toggleMenu()" style="background:none; border:none; font-size:1.8rem;">☰</button>
    <div style="margin-left:15px; font-weight:800;">StudyOS</div>
</header>

<main class="container">
    <div id="dash" class="section active">
        <div class="card" style="background:linear-gradient(135deg, #6366f1, #8b5cf6); color:white;">
            <p style="margin:0; opacity:0.8;">Daily Streak</p>
            <h1 style="margin:0;">🔥 <span id="streak-val">0</span> Days</h1>
        </div>
        <div class="card">
            <h3>To-Do List</h3>
            <div style="display:flex; gap:10px;">
                <input type="text" id="t-input" placeholder="New task..." style="flex:1; padding:12px; border-radius:12px; border:1px solid #ddd;">
                <button class="btn-p" onclick="addTask()" style="width:60px;">+</button>
            </div>
            <div id="t-list" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="pomo" class="section">
        <div class="card" style="text-align:center;">
            <h2>Pomodoro</h2>
            <div id="timer" style="font-size:4rem; font-weight:800; color:var(--p);">25:00</div>
            <input type="number" id="pomo-mins" placeholder="Set Mins" style="width:100px; padding:10px; margin-bottom:15px; text-align:center; border-radius:10px; border:1px solid #ddd;">
            <div style="display:flex; gap:10px;">
                <button class="btn-p" onclick="toggleTimer()" id="pomo-ctrl">Start</button>
                <button class="btn-p" style="background:#64748b" onclick="resetTimer()">Reset</button>
            </div>
        </div>
    </div>

    <div id="flash" class="section">
        <div class="scene" onclick="document.querySelector('.card-3d').classList.toggle('is-flipped')">
            <div class="card-3d" id="fc-render">
                <div class="card-face">Add a card to begin!</div>
                <div class="card-face card-back">...</div>
            </div>
        </div>
        <div class="card">
            <input type="text" id="fc-q" placeholder="Question">
            <input type="text" id="fc-a" placeholder="Answer">
            <p style="font-size:0.8rem;">Upload Image (Optional):</p>
            <input type="file" id="fc-img-input" accept="image/*">
            <button class="btn-p" style="margin-top:15px;" onclick="addFlashcard()">Save Card</button>
        </div>
    </div>

    <div id="calc" class="section">
        <div class="card">
            <div class="calc-display" id="calc-screen">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="calc('C')">C</button>
                <button class="calc-btn" onclick="calc('/')">/</button>
                <button class="calc-btn" onclick="calc('*')">×</button>
                <button class="calc-btn" onclick="calc('-')">-</button>
                <button class="calc-btn" onclick="calc('7')">7</button>
                <button class="calc-btn" onclick="calc('8')">8</button>
                <button class="calc-btn" onclick="calc('9')">9</button>
                <button class="calc-btn" onclick="calc('+')">+</button>
                <button class="calc-btn" onclick="calc('4')">4</button>
                <button class="calc-btn" onclick="calc('5')">5</button>
                <button class="calc-btn" onclick="calc('6')">6</button>
                <button class="calc-btn" onclick="calc('=')">=</button>
                <button class="calc-btn" onclick="calc('1')">1</button>
                <button class="calc-btn" onclick="calc('2')">2</button>
                <button class="calc-btn" onclick="calc('3')">3</button>
                <button class="calc-btn" onclick="calc('0')">0</button>
            </div>
        </div>
    </div>

    <div id="settings" class="section">
        <div class="card">
            <h3>Profile Account</h3>
            <center><div id="set-pfp-box" class="pfp-circle" style="width:100px; height:100px; font-size:2rem;"></div></center>
            <p>Upload Photo:</p>
            <input type="file" accept="image/*" onchange="uploadPFP(event)">
            <p>Change Name:</p>
            <input type="text" id="name-change" placeholder="Edit Name">
            <button class="btn-p" onclick="saveProfile()">Apply Changes</button>
        </div>
    </div>
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyA6fVzFz2IdjYsCt8TK_nGPwqbxrQ8hM3s",
        authDomain: "studyos-a8e51.firebaseapp.com",
        projectId: "studyos-a8e51",
        storageBucket: "studyos-a8e51.firebasestorage.app",
        messagingSenderId: "174218643372",
        appId: "1:174218643372:web:9cbd8066f745ba4171dc09"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let data = { tasks: [], flashcards: [], streak: 0, pfp: "", name: "Scholar" };
    let uid = null;

    // --- AUTH ---
    document.getElementById('login-google').onclick = () => signInWithPopup(auth, provider);
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
    window.closeAuth = () => document.getElementById('auth-gate').style.display = 'none';

    onAuthStateChanged(auth, async (user) => {
        if(user) {
            uid = user.uid;
            const snap = await getDoc(doc(db, "users", uid));
            if(snap.exists()) data = snap.data();
            else { data.name = user.displayName; data.pfp = user.photoURL; }
            closeAuth();
            render();
        }
    });

    const sync = async () => { if(uid) await setDoc(doc(db, "users", uid), data); render(); };

    // --- HELPERS ---
    window.toggleMenu = () => {
        document.getElementById('sidebar').classList.toggle('open');
        const over = document.getElementById('overlay');
        over.style.display = over.style.display === 'block' ? 'none' : 'block';
    };
    window.openPage = (id) => {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        toggleMenu();
    };

    // --- TASKS ---
    window.addTask = () => {
        const val = document.getElementById('t-input').value;
        if(!val) return;
        data.tasks.push({text: val, done: false});
        document.getElementById('t-input').value = "";
        sync();
    };

    // --- PFP (Base64 Method) ---
    window.uploadPFP = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onloadend = () => { data.pfp = reader.result; sync(); };
        if(file) reader.readAsDataURL(file);
    };

    window.saveProfile = () => {
        const n = document.getElementById('name-change').value;
        if(n) { data.name = n; sync(); alert("Updated!"); }
    };

    // --- FLASHCARDS (3D & Images) ---
    window.addFlashcard = () => {
        const q = document.getElementById('fc-q').value;
        const a = document.getElementById('fc-a').value;
        const file = document.getElementById('fc-img-input').files[0];
        if(!q) return;

        const reader = new FileReader();
        reader.onloadend = () => {
            data.flashcards.push({q, a, img: reader.result});
            document.getElementById('fc-q').value = "";
            document.getElementById('fc-a').value = "";
            document.getElementById('fc-img-input').value = "";
            sync();
        };
        if(file) reader.readAsDataURL(file);
        else { data.flashcards.push({q, a, img: ""}); sync(); }
    };

    // --- CALCULATOR ---
    let calcStr = "";
    window.calc = (v) => {
        const s = document.getElementById('calc-screen');
        if(v === 'C') calcStr = "";
        else if(v === '=') { try { calcStr = eval(calcStr).toString(); } catch { calcStr = "Error"; } }
        else calcStr += v;
        s.textContent = calcStr || "0";
    };

    // --- POMODORO ---
    let timerInt; let time = 1500; let active = false;
    window.toggleTimer = () => {
        if(!active) {
            const custom = document.getElementById('pomo-mins').value;
            if(custom && time === 1500) time = custom * 60;
            timerInt = setInterval(() => {
                if(time <= 0) { clearInterval(timerInt); alert("Finish!"); resetTimer(); }
                else { time--; updateT(); }
            }, 1000);
            document.getElementById('pomo-ctrl').textContent = "Pause";
        } else { clearInterval(timerInt); document.getElementById('pomo-ctrl').textContent = "Resume"; }
        active = !active;
    };
    window.resetTimer = () => { clearInterval(timerInt); time = 1500; active = false; updateT(); document.getElementById('pomo-ctrl').textContent = "Start"; };
    function updateT() { let m = Math.floor(time/60); let s = time%60; document.getElementById('timer').textContent = `${m}:${s<10?'0':''}${s}`; }

    function render() {
        // Render PFP & Name
        const pfpBoxes = [document.getElementById('side-pfp-box'), document.getElementById('set-pfp-box')];
        pfpBoxes.forEach(box => {
            if(data.pfp) box.innerHTML = `<img src="${data.pfp}" style="width:100%;height:100%;object-fit:cover;">`;
            else box.innerHTML = data.name.charAt(0).toUpperCase();
        });
        document.getElementById('side-name').textContent = data.name;
        document.getElementById('streak-val').textContent = data.streak;

        // Render Flashcard
        if(data.flashcards.length > 0) {
            const last = data.flashcards[data.flashcards.length - 1];
            document.getElementById('fc-render').innerHTML = `
                <div class="card-face">${last.q} ${last.img ? `<img src="${last.img}" class="card-img">` : ''}</div>
                <div class="card-face card-back">${last.a}</div>
            `;
        }
        
        // Render Tasks
        const tl = document.getElementById('t-list'); tl.innerHTML = "";
        data.tasks.forEach(t => tl.innerHTML += `<div class="card" style="margin-bottom:5px; padding:10px;">• ${t.text}</div>`);
    }
</script>
</body>
                </html>
