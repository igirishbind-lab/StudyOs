<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="StudyOS">

<link rel="apple-touch-icon" href="your-logo.png">

    <link rel="icon" type="image/png" href="https://i.ibb.co/DPMpkcbx/1767846395467.png">
<link rel="apple-touch-icon" href="https://i.ibb.co/DPMpkcbx/1767846395467.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudyOS | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --p: #6366f1; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; --accent: #f43f5e; }
        .dark { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --border: #334155; }
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; transition: 0.2s; }
        body { margin: 0; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }

        /* AUTH GATE */
        #auth-gate { position: fixed; inset: 0; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }

        /* SIDEBAR */
        #sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); border-right: 1px solid var(--border); z-index: 1500; padding: 25px; display: flex; flex-direction: column; }
        #sidebar.open { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; z-index: 1400; backdrop-filter: blur(4px); }
        @media (min-width: 992px) { body { padding-left: 280px; } #sidebar { left: 0 !important; } }

        .container { max-width: 1000px; margin: auto; padding: 20px; }
        .main-card { background: var(--card); border-radius: 24px; padding: 25px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        .grid-stats { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-box { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); text-align: center; }
        .prog-bar { width: 100%; height: 10px; background: var(--border); border-radius: 10px; margin-top: 10px; overflow: hidden; }
        #prog-fill { height: 100%; background: var(--p); width: 0%; transition: 0.5s; }

        /* FLASHCARDS */
        .scene { width: 100%; height: 280px; perspective: 1000px; cursor: pointer; margin-bottom: 20px; }
        .card-3d { width: 100%; height: 100%; position: relative; transition: 0.6s; transform-style: preserve-3d; }
        .card-3d.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: 24px; display: flex; align-items: center; justify-content: center; padding: 30px; text-align: center; font-size: 1.3rem; font-weight: 600; border: 2px solid var(--p); background: var(--card); }
        .card-back { transform: rotateY(180deg); background: var(--p); color: white; }

        .btn-p { background: var(--p); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 700; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .t-item { display: flex; align-items: center; padding: 15px; background: var(--bg); border-radius: 15px; margin-bottom: 10px; border: 1px solid var(--border); }
        .t-check { width: 22px; height: 22px; border-radius: 6px; border: 2.5px solid var(--p); margin-right: 15px; cursor: pointer; }
        .action-btn { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 5px; opacity: 0.6; }
        .action-btn:hover { opacity: 1; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .calc-btn { padding: 18px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 800; cursor: pointer; }
    </style>
</head>
<body class="light">

<div id="auth-gate">
    <div class="auth-card">
        
                <img src="https://i.ibb.co/DPMpkcbx/1767846395467.png" 
             style="width: 100px; height: 100px; border-radius: 22px; margin-bottom: 10px; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);">
        
        <h1 style="margin: 0; font-size: 2.2rem; letter-spacing: -1px;">StudyOS</h1>
        <p style="color: #6366f1; font-weight: 800; margin-top: 5px; margin-bottom: 25px; font-size: 0.9rem;">Made By Girish</p>
        
        <input type="email" id="auth-email" class="auth-input" placeholder="Email">
        <input type="password" id="auth-pass" class="auth-input" placeholder="Password">
        
        <button class="btn-p" id="email-login">Login / Sign Up</button>
        <button class="btn-p" id="google-login" style="background:#ea4335; margin-top: 10px;">Google Login</button>
        
        <div style="margin-top: 20px; border-top: 1px solid var(--border); pt-15">
             <button class="btn-p" onclick="closeAuth()" style="background:transparent; color: var(--p); border: 1px solid var(--border); margin-top: 15px;">Guest Access</button>
        </div>
    </div>
</div>


<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div id="sidebar">
    <h2 id="side-name">Scholar</h2>
    <div onclick="openPage('dash')" style="padding:15px 0; cursor:pointer;">🏠 Dashboard</div>
    <div onclick="openPage('pomo')" style="padding:15px 0; cursor:pointer;">⏱️ Pomodoro</div>
    <div onclick="openPage('flash')" style="padding:15px 0; cursor:pointer;">📚 Flashcards</div>
    <div onclick="openPage('calc')" style="padding:15px 0; cursor:pointer;">🔢 Calculator</div>
    <div onclick="openPage('settings')" style="padding:15px 0; cursor:pointer;">⚙️ Settings</div>
    <div style="margin-top:auto">
        <button class="btn-p" onclick="toggleDarkMode()" style="background:#334155">🌗 Theme</button>
        <button class="btn-p" id="logout-btn" style="background:#fee2e2; color:#ef4444">Logout</button>
    </div>
</div>

<header style="padding: 15px 20px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top:0; z-index:1000;">
    <button onclick="toggleMenu()" style="background:none; border:none; font-size:1.5rem; color:var(--text); cursor:pointer;">☰</button>
    <div style="font-weight:800;">StudyOS</div>
    <div onclick="openPage('settings')" id="user-pfp" style="width:38px; height:38px; background:var(--p); border-radius:12px; color:white; display:flex; align-items:center; justify-content:center; font-weight:800; cursor:pointer;">S</div>
</header>

<main class="container">
    <div id="dash" class="section active">
        <h2 id="welcome-msg">Hi, Scholar!</h2>
        <div class="grid-stats">
            <div class="stat-box" style="border: 2px solid #fbbf24;">
                <small>STREAK</small><p style="font-size:2rem; margin:5px 0;">🔥 <span id="streak-val">0</span></p>
            </div>
            <div class="stat-box"><small>PENDING</small><p style="font-size:1.5rem; margin:5px 0;">✅ <span id="task-stat">0</span></p></div>
            <div class="stat-box"><small>CARDS</small><p style="font-size:1.5rem; margin:5px 0;">📖 <span id="fc-stat">0</span></p></div>
        </div>

        <div class="main-card">
            <h3>Focus To-Do</h3>
            <div style="display:flex; gap:10px; margin-bottom:15px;">
                <input type="text" id="t-input" placeholder="New task..." class="auth-input" style="margin:0;">
                <button class="btn-p" onclick="addTask()" style="width:60px; margin:0;">+</button>
            </div>
            <div id="t-list"></div>
            <div id="prog-area" style="display:none; margin-top:15px;">
                <div style="display:flex; justify-content:space-between;"><small>Progress</small><small id="prog-pct">0%</small></div>
                <div class="prog-bar"><div id="prog-fill"></div></div>
            </div>
        </div>

        <div class="main-card">
            <h3>Leaderboard</h3>
            <div id="leader-list"></div>
        </div>
    </div>

    <div id="pomo" class="section">
        <div class="main-card" style="text-align:center;">
            <h2>Timer</h2>
            <h1 id="timer-display" style="font-size:4.5rem; margin:20px 0; font-weight:800; color:var(--p);">25:00</h1>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="number" id="pomo-mins" placeholder="Mins" class="auth-input" style="margin:0;">
                <button class="btn-p" onclick="setPomo()" style="width:100px; margin:0;">Set</button>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn-p" onclick="startTimer()">Start</button>
                <button class="btn-p" style="background:#64748b" onclick="pauseTimer()">Pause</button>
            </div>
            <div style="margin-top:30px; display:grid; grid-template-columns:1fr 1fr;">
                <div><small>TODAY</small><div id="daily-time" style="font-weight:800;">0m</div></div>
                <div><small>TOTAL</small><div id="total-time" style="font-weight:800;">0m</div></div>
            </div>
        </div>
    </div>

    <div id="flash" class="section">
        <div class="scene" onclick="document.getElementById('fc-card').classList.toggle('flipped')">
            <div class="card-3d" id="fc-card">
                <div class="card-face" id="fc-front">No Cards</div>
                <div class="card-face card-back" id="fc-back">Add one!</div>
            </div>
        </div>
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <button class="btn-p" style="width:60px" onclick="moveFC(-1)">◀</button>
            <span id="fc-page">0 / 0</span>
            <button class="btn-p" style="width:60px" onclick="moveFC(1)">▶</button>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button class="btn-p" onclick="editFC()" style="background:#64748b">Edit Current</button>
            <button class="btn-p" onclick="deleteFC()" style="background:#ef4444">Delete Current</button>
        </div>
        <div class="main-card">
            <input type="text" id="fc-q" placeholder="Front" class="auth-input">
            <input type="text" id="fc-a" placeholder="Back" class="auth-input">
            <button class="btn-p" onclick="addFC()">Add Card</button>
        </div>
    </div>

    <div id="calc" class="section">
        <div class="main-card">
            <input type="text" id="calc-screen" readonly style="width:100%; padding:20px; font-size:2rem; text-align:right; border:none; background:var(--bg); color:var(--text); border-radius:15px; margin-bottom:20px;">
            <div class="calc-grid" id="calc-btns"></div>
        </div>
    </div>

    <div id="settings" class="section">
        <div class="main-card">
            <h3>Settings</h3>
            <input type="text" id="name-change" class="auth-input" placeholder="Change Name">
            <button class="btn-p" onclick="saveProfile()">Save</button>
        </div>
    </div>
</main>

<script type="module">
    const firebaseConfig = {
        apiKey: "AIzaSyA6fVzFz2IdjYsCt8TK_nGPwqbxrQ8hM3s",
        authDomain: "studyos-a8e51.firebaseapp.com",
        projectId: "studyos-a8e51",
        storageBucket: "studyos-a8e51.firebasestorage.app",
        messagingSenderId: "174218643372",
        appId: "1:174218643372:web:9cbd8066f745ba4171dc09"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const app = initializeApp(firebaseConfig), auth = getAuth(app), db = getFirestore(app), prov = new GoogleAuthProvider();
    let data = { tasks: [], flashcards: [], streak: 1, lastLogin: null, name: "Scholar", darkMode: false, dailyStudyTime: 0, totalStudyTime: 0 };
    let uid = null, timerObj = null, timeLeft = 1500, initialTime = 1500, secondsEarned = 0, fcIdx = 0;

    onAuthStateChanged(auth, async (u) => {
        if(u) {
            uid = u.uid;
            const snap = await getDoc(doc(db, "users", uid));
            if(snap.exists()) data = snap.data();
            handleStreakAndReset();
            document.getElementById('auth-gate').style.display = 'none';
            applyTheme(); render(); loadLeaders();
        }
    });

    const sync = async () => { if(uid) await setDoc(doc(db, "users", uid), data); render(); };

    function handleStreakAndReset() {
        const now = new Date();
        const todayStr = now.toDateString(); 
        const lastLoginDate = data.lastLogin ? new Date(data.lastLogin) : null;
        
        if (lastLoginDate) {
            const lastStr = lastLoginDate.toDateString();
            if (todayStr !== lastStr) {
                // It's a brand new day
                const diffTime = now.setHours(0,0,0,0) - lastLoginDate.setHours(0,0,0,0);
                const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays === 1) data.streak += 1;
                else if (diffDays > 1) data.streak = 1;
                
                data.dailyStudyTime = 0; // Reset daily minutes
            }
        }
        data.lastLogin = new Date().toISOString();
        sync();
    }

    // TASKS CRUD
    window.addTask = () => {
        const v = document.getElementById('t-input').value;
        if(v) { data.tasks.push({text: v, done: false}); document.getElementById('t-input').value=''; sync(); }
    };
    window.editTask = (i) => {
        const n = prompt("Edit Task:", data.tasks[i].text);
        if(n) { data.tasks[i].text = n; sync(); }
    };
    window.deleteTask = (i) => {
        if(confirm("Delete this task?")) { data.tasks.splice(i, 1); sync(); }
    };
    window.toggleTask = (i) => {
        data.tasks[i].done = !data.tasks[i].done;
        if(data.tasks[i].done) confetti();
        sync();
    };

    // FLASHCARDS CRUD
    window.addFC = () => {
        const q = document.getElementById('fc-q').value, a = document.getElementById('fc-a').value;
        if(q && a) { data.flashcards.push({q,a}); document.getElementById('fc-q').value=''; document.getElementById('fc-a').value=''; sync(); }
    };
    window.editFC = () => {
        if(!data.flashcards[fcIdx]) return;
        const nq = prompt("Edit Question:", data.flashcards[fcIdx].q);
        const na = prompt("Edit Answer:", data.flashcards[fcIdx].a);
        if(nq && na) { data.flashcards[fcIdx] = {q:nq, a:na}; sync(); }
    };
    window.deleteFC = () => {
        if(data.flashcards.length > 0 && confirm("Delete this card?")) {
            data.flashcards.splice(fcIdx, 1);
            fcIdx = 0;
            sync();
        }
    };
    window.moveFC = (dir) => {
        if(!data.flashcards.length) return;
        fcIdx = (fcIdx + dir + data.flashcards.length) % data.flashcards.length;
        render();
    };

    // TIMER
    window.setPomo = () => { const m = document.getElementById('pomo-mins').value; if(m){ timeLeft=m*60; initialTime=timeLeft; upUI(); } };
    window.startTimer = () => {
        if(timerObj) return;
        secondsEarned = 0;
        timerObj = setInterval(() => {
            if(timeLeft > 0) { timeLeft--; secondsEarned++; upUI(); }
            else { clearInterval(timerObj); timerObj = null; saveStudy(); confetti(); alert("Break Time!"); }
        }, 1000);
    };
    window.pauseTimer = () => { clearInterval(timerObj); timerObj = null; saveStudy(); };
    function saveStudy() { data.dailyStudyTime += (secondsEarned/60); data.totalStudyTime += (secondsEarned/60); secondsEarned=0; sync(); }
    function upUI() { const m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById('timer-display').innerText=`${m}:${s<10?'0':''}${s}`; }

    // CALC
    const keys = ['C','(',')','/','7','8','9','*','4','5','6','-','1','2','3','+','0','.','='];
    const grid = document.getElementById('calc-btns');
    keys.forEach(k => {
        const b = document.createElement('button'); b.className='calc-btn'; b.innerText=k;
        if(k==='=') { b.style.gridColumn='span 2'; b.style.background='var(--p)'; b.style.color='white'; b.onclick=()=>solveCalc(); }
        else if(k==='C') b.onclick=()=>document.getElementById('calc-screen').value='';
        else b.onclick=()=>document.getElementById('calc-screen').value+=k;
        grid.appendChild(b);
    });
    function solveCalc(){ try{ document.getElementById('calc-screen').value = eval(document.getElementById('calc-screen').value); }catch{ alert("Error"); } }

    // CORE
    window.toggleDarkMode = () => { data.darkMode = !data.darkMode; applyTheme(); sync(); };
    function applyTheme() { document.body.className = data.darkMode ? 'dark' : 'light'; }
    window.openPage = (p) => { document.querySelectorAll('.section').forEach(s=>s.classList.remove('active')); document.getElementById(p).classList.add('active'); if(window.innerWidth<992) toggleMenu(); };
    window.toggleMenu = () => { const s=document.getElementById('sidebar'); s.classList.toggle('open'); document.getElementById('overlay').style.display=s.classList.contains('open')?'block':'none'; };
    window.saveProfile = () => { const n=document.getElementById('name-change').value; if(n) data.name=n; sync(); };

    async function loadLeaders() {
        const q = query(collection(db, "users"), orderBy("streak", "desc"), limit(5));
        const snap = await getDocs(q);
        const list = document.getElementById('leader-list'); list.innerHTML = "";
        snap.forEach(d => { const u=d.data(); list.innerHTML+=`<div class="leader-item"><span>${u.name}</span><strong>🔥 ${u.streak}</strong></div>`; });
    }

    function render() {
        document.getElementById('welcome-msg').innerText = `Hi, ${data.name}!`;
        document.getElementById('side-name').innerText = data.name;
        document.getElementById('streak-val').innerText = data.streak;
        document.getElementById('daily-time').innerText = Math.round(data.dailyStudyTime) + "m";
        document.getElementById('total-time').innerText = Math.round(data.totalStudyTime) + "m";
        document.getElementById('fc-stat').innerText = data.flashcards.length;
        
        const tl = document.getElementById('t-list'); tl.innerHTML = "";
        data.tasks.forEach((t, i) => {
            tl.innerHTML += `<div class="t-item">
                <div class="t-check" onclick="toggleTask(${i})" style="${t.done?'background:var(--p)':''}"></div>
                <span style="flex:1; ${t.done?'text-decoration:line-through;opacity:0.5':''}">${t.text}</span>
                <button class="action-btn" onclick="editTask(${i})">✏️</button>
                <button class="action-btn" onclick="deleteTask(${i})">🗑️</button>
            </div>`;
        });

        const done = data.tasks.filter(t=>t.done).length, tot = data.tasks.length;
        document.getElementById('task-stat').innerText = tot - done;
        if(tot > 0) {
            document.getElementById('prog-area').style.display='block';
            const pct = Math.round((done/tot)*100);
            document.getElementById('prog-fill').style.width = pct+'%';
            document.getElementById('prog-pct').innerText = pct+'%';
        }

        if(data.flashcards[fcIdx]) {
            document.getElementById('fc-front').innerText = data.flashcards[fcIdx].q;
            document.getElementById('fc-back').innerText = data.flashcards[fcIdx].a;
            document.getElementById('fc-page').innerText = `${fcIdx + 1} / ${data.flashcards.length}`;
        } else {
            document.getElementById('fc-front').innerText = "No Cards";
            document.getElementById('fc-back').innerText = "Add one!";
            document.getElementById('fc-page').innerText = "0 / 0";
        }
    }

    document.getElementById('google-login').onclick = () => signInWithPopup(auth, prov);
    document.getElementById('email-login').onclick = async () => {
        const e = document.getElementById('auth-email').value, p = document.getElementById('auth-pass').value;
        try { await signInWithEmailAndPassword(auth, e, p); } catch { await createUserWithEmailAndPassword(auth, e, p); }
    };
    document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());
    window.closeAuth = () => document.getElementById('auth-gate').style.display = 'none';
</script>
</body>
</html>
